name: Fetch Latest Lotto

on:
  schedule:
    # 수집기는 빠진 회차가 없으면 바로 끝나므로, 실패 대비 재시도를 겸해 여러 번 예약한다
    - cron: '0 12 * * 6'   # 토요일 21:00 KST
    - cron: '30 12 * * 6'  # 토요일 21:30 KST
    - cron: '0 15 * * 6'   # 일요일 00:00 KST
    - cron: '0 0 * * 0'    # 일요일 09:00 KST
    - cron: '0 12 * * 0'   # 일요일 21:00 KST
    - cron: '0 0 * * 1'    # 월요일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch lotto result
        id: fetch
        # 일부 회차만 수집돼도 저장되도록 실패해도 커밋 단계까지 진행하고, 마지막에 실패로 처리한다
        continue-on-error: true
        run: python3 scripts/fetch_lotto.py

      - name: Upload debug html
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: data/debug_naver.html
          if-no-files-found: ignore

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/draws.json data/latest.json data/stats.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            round=$(python3 -c "import json; print(json.load(open('data/latest.json'))['drwNo'])")
            git commit -m "당첨번호 자동 업데이트 ${round}회"
            git pull --rebase origin main
            git push
          fi

      - name: Report fetch failure
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "당첨번호 수집 실패 — 로그와 debug-html 아티팩트를 확인하세요"
          exit 1
